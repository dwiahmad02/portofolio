<!doctype html>
<html lang="id" data-theme="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />

    <!-- SEO dan pratinjau saat tautan dibagikan -->
    <title></title>
    <meta name="description" content="" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="" />
    <meta property="og:description" content="" />
    <meta property="og:image" content="" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Ikon tab browser (siapkan file favicon.svg) -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />

    <!-- Font: isi nama font di sini nanti, lalu pakai di style.css -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <a class="skip-link" href="#main">Langsung ke konten</a>

    <!-- ============ HEADER ============ -->
    <header class="site-header" id="top">
      <div class="container site-header__inner">
        <a
          class="site-header__brand"
          href="#top"
          aria-label="Kembali ke atas"
        ></a>

        <nav class="site-nav" id="site-nav" aria-label="Navigasi utama">
          <ul class="site-nav__list">
            <li><a class="site-nav__link" href="#proyek">Proyek</a></li>
            <li><a class="site-nav__link" href="#keahlian">Keahlian</a></li>
            <li><a class="site-nav__link" href="#tentang">Tentang</a></li>
            <li><a class="site-nav__link" href="#kontak">Kontak</a></li>
          </ul>
        </nav>

        <div class="site-header__tools">
          <!-- JS nanti: ganti data-theme di <html> antara "light" dan "dark" -->
          <button
            class="theme-toggle"
            type="button"
            data-theme-toggle
            aria-label="Ganti tema terang atau gelap"
          >
            <span class="theme-toggle__icon" aria-hidden="true"></span>
          </button>
          <!-- JS nanti: buka/tutup menu di layar kecil, ubah aria-expanded -->
          <button
            class="nav-toggle"
            type="button"
            data-nav-toggle
            aria-expanded="false"
            aria-controls="site-nav"
            aria-label="Buka menu"
          >
            <span class="nav-toggle__bar" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </header>

    <main id="main">
      <!-- ============ HERO ============ -->
      <section class="hero" aria-labelledby="hero-title">
        <div class="container hero__inner">
          <p class="hero__status"></p>
          <h1 class="hero__title" id="hero-title">
            <span class="hero__name"></span>
          </h1>
          <p class="hero__lead"></p>
          <div class="hero__actions">
            <a class="button button--primary" href="#proyek"></a>
            <a class="button button--ghost" href="#kontak"></a>
          </div>
        </div>
      </section>

      <!-- ============ PROYEK ============ -->
      <section
        class="section projects"
        id="proyek"
        aria-labelledby="proyek-title"
        data-reveal
      >
        <div class="container">
          <header class="section__head">
            <span class="section__no" aria-hidden="true">01</span>
            <h2 class="section__title" id="proyek-title">Proyek</h2>
          </header>
          <p class="section__intro"></p>

          <ol class="projects__list">
            <!-- Salin blok <li> ini untuk menambah proyek -->
            <li class="project" data-project>
              <details class="project__details" open>
                <summary class="project__summary">
                  <time class="project__year"></time>
                  <span class="project__heading">
                    <h3 class="project__title"></h3>
                    <ul class="tag-list" aria-label="Teknologi">
                      <li class="tag"></li>
                    </ul>
                  </span>
                  <span class="project__icon" aria-hidden="true"></span>
                </summary>

                <div class="project__content">
                  <!-- Opsional: tangkapan layar proyek
                <figure class="project__media"><img src="" alt="" loading="lazy" width="" height=""></figure> -->
                  <dl class="project__facts">
                    <div class="project__fact">
                      <dt>Masalah</dt>
                      <dd></dd>
                    </div>
                    <div class="project__fact">
                      <dt>Peran saya</dt>
                      <dd></dd>
                    </div>
                    <div class="project__fact">
                      <dt>Hasil</dt>
                      <dd></dd>
                    </div>
                  </dl>
                  <ul class="project__links">
                    <li>
                      <a
                        class="button button--small"
                        href=""
                        target="_blank"
                        rel="noopener"
                        >Lihat demo</a
                      >
                    </li>
                    <li>
                      <a
                        class="button button--small"
                        href=""
                        target="_blank"
                        rel="noopener"
                        >Lihat kode</a
                      >
                    </li>
                  </ul>
                </div>
              </details>
            </li>
          </ol>
        </div>
      </section>

      <!-- ============ KEAHLIAN ============ -->
      <section
        class="section skills"
        id="keahlian"
        aria-labelledby="keahlian-title"
        data-reveal
      >
        <div class="container">
          <header class="section__head">
            <span class="section__no" aria-hidden="true">02</span>
            <h2 class="section__title" id="keahlian-title">Keahlian</h2>
          </header>

          <div class="skills__grid">
            <!-- Salin blok <article> ini untuk menambah kelompok -->
            <article class="skill-group">
              <h3 class="skill-group__title"></h3>
              <ul class="tag-list">
                <li class="tag"></li>
              </ul>
            </article>
          </div>
        </div>
      </section>

      <!-- ============ TENTANG ============ -->
      <section
        class="section about"
        id="tentang"
        aria-labelledby="tentang-title"
        data-reveal
      >
        <div class="container about__inner">
          <header class="section__head">
            <span class="section__no" aria-hidden="true">03</span>
            <h2 class="section__title" id="tentang-title">Tentang saya</h2>
          </header>
          <div class="about__text">
            <p></p>
          </div>
          <!-- Opsional: foto profil
        <figure class="about__photo"><img src="" alt="" loading="lazy" width="" height=""></figure> -->
        </div>
      </section>

      <!-- ============ KONTAK ============ -->
      <section
        class="section contact"
        id="kontak"
        aria-labelledby="kontak-title"
        data-reveal
      >
        <div class="container contact__inner">
          <header class="section__head">
            <span class="section__no" aria-hidden="true">04</span>
            <h2 class="section__title" id="kontak-title">Kontak</h2>
          </header>
          <a class="contact__mail" href="mailto:"></a>
          <ul class="contact__links">
            <li>
              <a
                class="button button--outline"
                href=""
                target="_blank"
                rel="noopener"
              ></a>
            </li>
            <li>
              <a
                class="button button--outline"
                href=""
                target="_blank"
                rel="noopener"
              ></a>
            </li>
          </ul>
        </div>
      </section>
    </main>

    <!-- ============ FOOTER ============ -->
    <footer class="site-footer">
      <div class="container site-footer__inner">
        <p class="site-footer__copy">© <span data-year></span></p>
        <a class="site-footer__top" href="#top">Kembali ke atas</a>
      </div>
    </footer>
  </body>
</html>
